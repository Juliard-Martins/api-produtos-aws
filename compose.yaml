services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: catalogo
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?execute npm run configurar}
      DB_PASSWORD: ${DB_PASSWORD:?execute npm run configurar}
    volumes:
      - dados_postgres:/var/lib/postgresql/data
      - ./deploy/iniciar-banco.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d catalogo"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    environment:
      API_TOKEN: ${API_TOKEN:?execute npm run configurar}
      DB_PASSWORD: ${DB_PASSWORD:?execute npm run configurar}
      DB_HOST: db
      HOST: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dados_postgres:
